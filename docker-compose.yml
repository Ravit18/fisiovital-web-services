services:
  postgres:
    image: postgres:16
    container_name: fisiovital-postgres
    environment:
      POSTGRES_DB: fisiovital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fisiovital-data:/var/lib/postgresql/data

  api:
    build: .
    container_name: fisiovital-api
    profiles: ["full"]
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fisiovital
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Se leen del .env de esta carpeta (si no existe, quedan vacias)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  fisiovital-data:
