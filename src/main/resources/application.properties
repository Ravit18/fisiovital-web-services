spring.application.name=fisiovital-web-services
server.port=8080

# Variables locales (API keys) desde .env en la raiz del proyecto. Es opcional y no se sube a GitHub.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (puedes sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fisiovital}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# US14 - Timeout de consulta (ms). Si una query lo supera, GlobalExceptionHandler responde 503.
spring.jpa.properties.jakarta.persistence.query.timeout=${QUERY_TIMEOUT_MS:120000}

# i18n (en_US y es_419)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# JWT
app.jwt.secret=${JWT_SECRET:Rhuz3RyWcfctujSjVT9r77d/hyiiD252fSv4oMTm6BvuYrgK/8jwohKC3w0Zx6V6tvqTz6x33lWCOeuJN8T1ZQ==}
app.jwt.expiration-minutes=1440

# CORS (Angular del Sprint 2). Patrones de origen separados por coma; en local se acepta cualquier puerto
# (ng serve cambia de puerto si el 4200 está ocupado). En la nube fijar los dominios reales.
# Ejemplo: CORS_ALLOWED_ORIGINS=https://fisiovital.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Recordatorios
app.reminders.hours-before=24
# Intervalo de la tarea que envía recordatorios (ms), configurable sin recompilar.
app.reminders.fixed-delay-ms=${REMINDER_FIXED_DELAY_MS:600000}
# Correo de recordatorios (US13) con Gmail. Las credenciales van en .env:
# MAIL_USERNAME (tu correo de Gmail) y MAIL_PASSWORD (contrasena de aplicacion de 16 caracteres).
# Sin credenciales, el recordatorio queda solo como notificacion en la plataforma.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@fisiovital.pe}}

# Asistente con IA (US17-US20): Spring AI + Google Gemini (plan gratuito). La key va en .env (GEMINI_API_KEY).
# Sin key, la app arranca igual y el asistente responde 503 "El asistente no esta disponible".
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:60000}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.model.embedding.text=none
# Pocos reintentos: si Gemini falla, el usuario recibe el 503 rapido en lugar de esperar minutos.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=500ms
spring.ai.retry.backoff.max-interval=2s

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
