# Configuracion de pruebas de integracion: H2 en memoria en modo PostgreSQL.
# Sustituye al datasource real (Docker/Postgres) solo bajo el profile "test".
spring.datasource.url=jdbc:h2:mem:fisiovital;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# i18n igual que en produccion
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Los tests no dependen del .env: Gemini esta simulado (@MockitoBean ChatModel) y no se envian correos reales.
# AssistantWithoutKeyTest vacia la key con @TestPropertySource para probar el 503.
app.ai.gemini.api-key=test-key
spring.mail.username=

# El timeout de consulta se deja corto en tests para poder ejercitar el 503 de US14
spring.jpa.properties.jakarta.persistence.query.timeout=120000
