# Blueprint de Render: backend en Docker; la BD es PostgreSQL en Supabase (Session pooler, IPv4).
# Los valores con sync: false se piden al crear el Blueprint y no quedan en el repo.
services:
  - type: web
    name: fisiovital-web-services
    runtime: docker
    plan: free
    region: oregon # misma zona que Supabase (aws us-west-2)
    branch: main
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_URL
        sync: false # jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        sync: false # postgres.<project-ref>
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # URL del front desplegado, separadas por coma
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
